# Task3: AMEND uses the same AnomalyNCD training protocol for fair comparison.
binarization:
  sample_rate: 4
  min_interval_len: 4
  erode: True
models:
  grad_from_block: 11
  pretrained_backbone: dino_vitb8
  mask_layers: 9
  n_views: 2
  n_head: 1
  use_etf: False
training:
  batch_size: 32
  num_workers: 8
  lr: 0.003
  gamma: 0.1
  momentum: 0.9
  weight_decay: 0.00005
  epochs: 50
loss:
  sup_weight: 0.3
  memax_weight: 4
  anomaly_thred: 0.5
  teacher_temp: 0.04
  warmup_teacher_temp: 0.07
  warmup_teacher_temp_epochs: 40
  repeat_times: 4
train_subset:
  enabled: False
  ratio: 0.5
  normal_class: good
amend:
  # MVTec sub-images follow the fine-grained setting in the AMEND paper.
  neighbors: 4
  expanded_neighbors: 5
  bank_size: 2048
  expanded_affinity: 0.1
  margin_weight: 1.0
  projection_dim: 256
  temperature: 0.1
experiment:
  seed: 3407
  print_freq: 3
  table_root: outputs/output_table
  exp_name: AnomalyNCD_AMEND
  exp_root: outputs
