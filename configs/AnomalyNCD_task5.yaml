# Task5: TAC Cross-modal Mutual Distillation —— 文本/图像聚类头跨模态互蒸馏。
# 非端到端：文本特征冻结，AnomalyNCD 内新增可训练文本聚类头，训练阶段联合优化。
binarization:
  sample_rate: 4
  min_interval_len: 4
  erode: True
models:
  grad_from_block: 11
  pretrained_backbone: dino_vitb8
  mask_layers: 9
  n_views: 2
  n_head: 4
  use_etf: False
training:
  batch_size: 32
  num_workers: 8
  lr: 0.003
  gamma: 0.1
  momentum: 0.9
  weight_decay: 0.00005
  epochs: 50
loss:
  sup_weight: 0.3
  memax_weight: 4
  anomaly_thred: 0.5
  teacher_temp: 0.04
  warmup_teacher_temp: 0.07
  warmup_teacher_temp_epochs: 40
  repeat_times: 4
train_subset:
  enabled: False
  ratio: 0.5
  normal_class: good
text_counterpart:
  enabled: True
  root: data_store/text_counterpart
  top_k: 5
  tau: 0.005
  cluster_num: null
  concat_in_features: False
  project_text: False
cmd:
  enabled: True
  weight: 0.1
  entropy_weight: 1.0
  temperature: 0.5
experiment:
  seed: 3407
  print_freq: 3
  table_root: outputs/output_table
  exp_name: AnomalyNCD_Task5
  exp_root: outputs
